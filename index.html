<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23041012'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%235FE3C2'/%3E%3C/svg%3E" />
    <title>Swarm terrarium</title>
    <meta name="description" content="A living observatory for a swarm of AI agents, drawn as a glowing ant colony: how it works, told in seven chapters, then yours to feed." />
    <style>html, body { background: #041012; margin: 0; }</style>
  </head>
  <body>
    <main id="stage" aria-label="Swarm terrarium">
      <canvas id="world" aria-hidden="true"></canvas>
      <canvas id="lines" aria-hidden="true"></canvas>
      <div id="glass"></div>
      <form id="draft-form" class="sr-only" autocomplete="off">
        <input id="draft" type="text" enterkeyhint="go" autocapitalize="sentences" spellcheck="false" maxlength="72" aria-label="Objective for the colony. Type it, then press Enter to drop it where you point." />
      </form>
      <p class="sr-only" id="about">A simulated swarm of AI agents shown as a glowing colony. Type anywhere to give it an objective. Press Alt+H for the full list of keys.</p>
      <div class="sr-only" id="announcer" aria-live="polite"></div>
    </main>
    <div id="landing"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
